<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD - T02 - Procesamiento de Bordes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Agregar Bordes a Imágenes</h1>
        
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" id="fileInput" name="file" accept=".jpg,.jpeg,.png,.bmp">
            <button type="submit">Procesar</button>
        </form>
        
        <div id="errorContainer" class="error"></div>
        
        <div class="gallery-container">
            <div class="image-column">
                <h2>Original</h2>
                <div id="originalGallery" class="gallery">
                    {% for img in originales %}
                        <img src="{{ url_for('serve_original', filename=img) }}" alt="Original">
                    {% endfor %}
                </div>
            </div>
            
            <div class="image-column">
                <h2>Con Bordes</h2>
                <div id="borderedGallery" class="gallery">
                    {% for img in bordes %}
                        <img src="{{ url_for('serve_bordered', filename=img) }}" alt="Con bordes">
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
